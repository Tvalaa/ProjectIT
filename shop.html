            </ul>
        </nav>
    </header>

    <div id="filtersSidebar" class="sidebar">
        <button onclick="hideSidebar()">Close</button>
        <div class="filter-options">
            <input type="text" placeholder="Category">
            <input type="text" placeholder="Brand">
            <input type="range" min="0" max="1000" step="10" placeholder="Price">
            <input type="text" placeholder="Rating">
        </div>
    </div>

    <main>
        <div id="product-list"></div>
    </main>

    <script>
function displayCart() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const productList = document.getElementById('product-list');
    productList.innerHTML = '';

    if (cart.length === 0) {
        productList.innerHTML = '<div class="shopping-cart"><p class="empty-cart">Your cart is empty!</p></div>';
        return;
    }

    cart.forEach((product) => {
        const productCard = document.createElement('div');
        productCard.classList.add('product-card');
        productCard.innerHTML = `
            <div class="cart-item">
                <img class="item-thumbnail" src="${product.thumbnail || 'default-image.avif'}" alt="${product.title}" />
                <div class="item-details">
                    <h3>${product.title}</h3>
                    <p>${product.description}</p>
                    <p>Price: ${product.price} ${product.currency}</p>
                    <p>Quantity: ${product.quantity}</p>
                </div>
                <button class="delete-button" onclick="deleteFromCart('${product.id}')">Delete</button>
            </div>
        `;
        productList.appendChild(productCard);
    });
}

        function deleteFromCart(productId) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            cart = cart.filter(item => item.id !== productId);

            localStorage.setItem('cart', JSON.stringify(cart));

            alert('Product removed from cart!');

            displayCart();
        }

        document.addEventListener('DOMContentLoaded', displayCart);
    </script>
    <script src="script.js"></script>
    <script src="shopscript.js"></script>

</body>

</html>
